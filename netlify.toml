[build]
  command = "npm run build"
  publish = "dist"

# Retired blog. Articles live on the newsletter now; 301 so the old URLs keep
# their search equity and any existing links still land somewhere real.
# These must come before the SPA fallback — Netlify matches in order.
[[redirects]]
  from = "/blogs"
  to = "https://createwithrajiv.substack.com/"
  status = 301
  force = true

[[redirects]]
  from = "/blogs/*"
  to = "https://createwithrajiv.substack.com/"
  status = 301
  force = true

# SPA fallback for every remaining route.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
