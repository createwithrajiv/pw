[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback so /blogs/:slug deep links resolve instead of 404-ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
