<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1120" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light dark" />
    <title>Rajiv Yadav — AI Engineer</title>
    <meta
      name="description"
      content="AI Engineer building production AI systems that scale — ML infrastructure, MLOps, and LLM orchestration."
    />
    <!-- FOUC guard: resolve theme before first paint so there is no flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var mode = stored || 'light'; /* must match settings.themeDefault */
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = mode === 'system' ? (systemDark ? 'dark' : 'light') : mode;
          var el = document.documentElement;
          el.classList.toggle('dark', resolved === 'dark');
          el.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
